services:
  - type: worker
    name: vehicle-life-bot
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    numInstances: 1
    envVars:
      - key: DISCORD_TOKEN
        sync: false
      - key: CLIENT_ID
        sync: false
      - key: GUILD_ID
        sync: false
      - key: TOP_GARAGES_CHANNEL_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: vehiclelife
